name: Build and Push Code Server Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Base image tag of codercom/code-server'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image name
        id: image
        run: |
          echo "name=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Get code-server version
        id: version
        run: |
          VERSION="$(docker run --rm "codercom/code-server:${{ github.event.inputs.tag }}" code-server --version 2>/dev/null | head -n1 | awk '{print $1}' | tr -d 'v')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get short commit hash
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            CODE_SERVER_TAG=${{ github.event.inputs.tag }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}-latest
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}-${{ steps.commit.outputs.short }}